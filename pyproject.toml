[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[project]
name = "many-abis"
version = "0.5.0"
description = "Verified ABI and EVM chain metadata with pinned provenance."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
keywords = [
    "abi",
    "arbitrum",
    "base",
    "blockchain",
    "bsc",
    "dex",
    "eth",
    "hyperliquid",
    "monad",
    "pancakeswap",
    "polygon",
    "robinhood",
    "sonic",
    "unichain",
    "uniswap",
    "web3",
    "xlayer",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "addict>=2.4,<3",
    "eth-hash[pycryptodome]>=0.8,<1",
    "eth-utils>=6,<7",
    "pycryptodome>=3.23,<4",
    "requests>=2.33,<3",
    "urllib3>=2.7,<3",
]

[[project.authors]]
name = "Yong"

[project.urls]
Documentation = "https://github.com/ackness/many_abis#readme"
Issues = "https://github.com/ackness/many_abis/issues"
"License and provenance" = "https://github.com/ackness/many_abis/blob/main/THIRD_PARTY_NOTICES.md"
Source = "https://github.com/ackness/many_abis"

[dependency-groups]
dev = [
    "jsonschema[format-nongpl]>=4.18,<5",
    "mypy>=1.20,<3",
    "twine>=7,<8",
]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.12.7,<0.13"

[tool.uv.build-backend]
module-name = "many_abis"
module-root = ""
source-include = ["examples/**"]
source-exclude = [
    "/.github",
    "/docs",
    "/registry",
    "/scripts",
    "/tests",
    "/tea.yaml",
]

[tool.mypy]
python_version = "3.13"
files = ["many_abis"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
