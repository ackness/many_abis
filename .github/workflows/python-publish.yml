# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: python -m pip install --upgrade pip
    - run: python -m pip install .
    - run: python -m pip install -r requirements-dev.txt
    - run: python scripts/generate_registry.py --check
    - run: python -m unittest discover -s tests -v
    - run: python -m mypy

  deploy:
    needs: verify

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install .
        python -m pip install -r requirements-dev.txt
    - name: Build package
      run: python -m build
    - name: Smoke-test wheel outside source tree
      run: |
        python -m pip install --target /tmp/many-abis-release dist/*.whl
        cd /tmp
        PYTHONPATH=/tmp/many-abis-release python - <<'PY'
        from pathlib import Path

        import many_abis as m

        root = Path("/tmp/many-abis-release")
        assert m.loaded_abis() == []
        assert len(m.ALL_ABIS_NAME) == 69
        assert all(m.get_abi(name) for name in m.ALL_ABIS_NAME)
        assert len(m.loaded_abis()) == 69
        assert (root / "many_abis" / "abis.pyi").is_file()
        assert (root / "many_abis" / "py.typed").is_file()
        license_dirs = list(root.glob("many_abis-*.dist-info/licenses"))
        assert len(license_dirs) == 1
        assert (license_dirs[0] / "LICENSE").is_file()
        assert (license_dirs[0] / "THIRD_PARTY_NOTICES.md").is_file()
        PY
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
