name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run --frozen python scripts/generate_registry.py --check
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen mypy

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run --frozen python scripts/build_release_artifacts.py --output-dir dist
      - run: uv run --frozen python scripts/check_distribution.py dist
      - run: uv run --frozen twine check dist/*
      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with ./dist/*.whl python tests/smoke_distribution.py
      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with ./dist/*.tar.gz python tests/smoke_distribution.py
