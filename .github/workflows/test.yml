name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run --frozen python scripts/generate_registry.py --check
      - run: uv run --frozen python -m unittest discover -s tests -v
      - name: Check optional web3 examples offline
        run: uv run --frozen --with web3==8.0.0 python -m unittest discover -s tests -p test_singleton_examples.py -v
      - run: uv run --frozen mypy

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run --frozen python scripts/build_release_artifacts.py --output-dir dist
      - run: uv run --frozen python scripts/check_distribution.py dist
      - run: uv run --frozen twine check dist/*
      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with ./dist/*.whl python tests/smoke_distribution.py
      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with ./dist/*.tar.gz python tests/smoke_distribution.py
